# Dependency policy, enforced by scripts/check-security.sh (cargo-deny).
#
# An entry in `ignore` is a decision, not a way to make the check pass: it says
# why the advisory does not reach this project and when to drop it. Review the
# list at every Bevy upgrade.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser: unmaintained, not a vulnerability. Reached through winit's
    # Linux window decorations (sctk-adwaita), with system fonts only.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained; no fix until winit moves off it" },
]

[licenses]
version = 2
# Licences compatible with the project's GPL version 3 (see NOTICE.md). OFL-1.1 and Ubuntu-font-1.0 cover the fonts
# embedded by egui.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
unused-allowed-license = "allow"

# The workspace's own crates are unpublished; their licence is in NOTICE.md.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
