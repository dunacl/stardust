[package]
name = "sg-app"
description = "Stardust application: Bevy shell with an egui control panel (PLAN.md §9)."
version.workspace = true
edition.workspace = true
rust-version = "1.97.1" # Bevy 0.20
publish.workspace = true
license.workspace = true

[lib]
name = "sg_app"
path = "src/lib.rs"

[[bin]]
name = "sg-app"
path = "src/main.rs"

[dependencies]
sg-schema.workspace = true
sg-sim = { workspace = true, features = ["classic"] }
sg-render.workspace = true
sg-core.workspace = true
bevy.workspace = true
bevy_egui.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Already in the tree through Bevy; used to read the page's query string.
web-sys = { version = "0.3", features = [
    "Blob",
    "Document",
    "Element",
    "HtmlAnchorElement",
    "HtmlElement",
    "Location",
    "Url",
    "Window",
] }
js-sys = "0.3"

[features]
# Build the web app for WebGPU instead of WebGL2. Bevy cannot do both in
# one binary, so the web build makes two and the page picks one
# (scripts/build-web.sh).
webgpu = ["bevy/webgpu"]

[lints]
workspace = true
