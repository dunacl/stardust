[workspace]
resolver = "2"
members = ["crates/*", "apps/sg-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false
license = "GPL-3.0-only"

[workspace.dependencies]
sg-core = { path = "crates/sg-core" }
sg-schema = { path = "crates/sg-schema" }
sg-stellar = { path = "crates/sg-stellar" }
sg-disk = { path = "crates/sg-disk" }
sg-formation = { path = "crates/sg-formation" }
sg-dynamics = { path = "crates/sg-dynamics" }
sg-planet = { path = "crates/sg-planet" }
sg-classic = { path = "crates/sg-classic" }
sg-sim = { path = "crates/sg-sim", default-features = false }
sg-render = { path = "crates/sg-render" }

libm = "0.2"
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proptest = "1"

# App shell and renderer only. Simulation crates must never depend on these
# (PLAN.md §6.2, enforced by scripts/check-deps.sh). Pinned: Bevy breaks its
# API every release, so upgrades happen in dedicated changes (PLAN.md §12).
bevy = { version = "=0.20.1", default-features = false, features = [
    "default_app",
    "default_platform",
    "3d_bevy_render",
] }
bevy_egui = { version = "=0.43.1", default-features = false, features = [
    "default_fonts",
    "render",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Bevy is unusably slow unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

# The renderer generates its sky textures on the CPU at startup.
[profile.dev.package.sg-render]
opt-level = 2

[profile.release]
opt-level = 3

# Release archives (scripts/release.sh): stripped, so the download is small.
[profile.dist]
inherits = "release"
lto = "thin"
strip = true

# The web app: optimised for download size.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
# Function names alone are more than half of an unstripped build.
strip = true
