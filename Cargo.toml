[workspace]
resolver = "2"
members = ["crates/*", "apps/sg-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
sg-core = { path = "crates/sg-core" }
sg-schema = { path = "crates/sg-schema" }
sg-stellar = { path = "crates/sg-stellar" }
sg-disk = { path = "crates/sg-disk" }
sg-formation = { path = "crates/sg-formation" }
sg-dynamics = { path = "crates/sg-dynamics" }
sg-planet = { path = "crates/sg-planet" }
sg-classic = { path = "crates/sg-classic" }
sg-sim = { path = "crates/sg-sim", default-features = false }

libm = "0.2"
rand_chacha = { version = "0.3", default-features = false }
rand_core = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
